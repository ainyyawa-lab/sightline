<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SightLine</title>
<style>
body{font-family:system-ui,sans-serif;background:#0f1420;color:#e8ecf4;margin:0;padding:24px;display:flex;flex-direction:column;align-items:center}
h1{margin:0 0 4px}p.sub{color:#8c97ad;margin:0 0 20px}
.box{background:#1a2133;border-radius:14px;padding:20px;width:100%;max-width:760px;margin-bottom:16px}
button,input{font:inherit}button{background:#4f8cff;color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
img,video{max-width:100%;border-radius:10px;margin-top:12px}
.chip{display:inline-block;background:#26324d;border-radius:20px;padding:4px 12px;margin:4px 6px 0 0;font-size:14px}
progress{width:100%;margin-top:10px}
</style></head><body>
<h1>👁️ SightLine</h1><p class="sub">Object detection for images and video, powered by YOLOv8 + FastAPI</p>

<div class="box"><h3>Image</h3>
<input type="file" id="img" accept="image/*"> <button onclick="doImg()">Detect</button>
<div id="chips"></div><img id="out" alt=""></div>

<div class="box"><h3>Video</h3>
<input type="file" id="vid" accept="video/*"> <button onclick="doVid()">Process</button>
<progress id="bar" value="0" max="1" hidden></progress><div id="vmsg"></div><div id="vchips"></div><video id="vout" controls hidden></video></div>

<script>
async function doImg(){
  const f=document.getElementById('img').files[0]; if(!f) return;
  const fd=new FormData(); fd.append('file',f);
  const [j,a]=await Promise.all([fetch('/detect',{method:'POST',body:fd}).then(r=>r.json()),
    fetch('/detect/annotated',{method:'POST',body:fd}).then(r=>r.blob())]);
  document.getElementById('out').src=URL.createObjectURL(a);
  document.getElementById('chips').innerHTML=Object.entries(j.summary).map(([k,v])=>`<span class="chip">${k} × ${v}</span>`).join('')+`<span class="chip">${j.inference_ms} ms</span>`;
}
async function doVid(){
  const f=document.getElementById('vid').files[0]; if(!f) return;
  const fd=new FormData(); fd.append('file',f);
  const bar=document.getElementById('bar'), msg=document.getElementById('vmsg'); bar.hidden=false;
  let job=await fetch('/video',{method:'POST',body:fd}).then(r=>r.json());
  while(job.status==='queued'||job.status==='processing'){
    await new Promise(r=>setTimeout(r,1000));
    job=await fetch('/video/'+job.job_id).then(r=>r.json()); bar.value=job.progress; msg.textContent=job.status;
  }
  if(job.status==='done'){const v=document.getElementById('vout');v.src='/video/'+job.job_id+'/result';v.hidden=false;
    document.getElementById('vchips').innerHTML='<p>Unique objects tracked:</p>'+Object.entries(job.unique_objects||{}).map(([k,n])=>`<span class="chip">${k} × ${n}</span>`).join('');}
  else msg.textContent='Failed: '+job.error;
}
</script></body></html>
